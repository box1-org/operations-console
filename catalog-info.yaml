apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: operations-console
  description: "Single Pane of Glass"
  annotations:
    github.com/project-slug: box1-org/operations-console
    backstage.io/kubernetes-id: operations-console
    backstage.io/techdocs-ref: dir:.
    backstage.io/source-location: url:https://github.com/box1-org/operations-console/
    janus-idp.io/tekton: operations-console
    argocd/instance-name: openshift-gitops
    argocd/app-selector: backstage.io/kubernetes-id=operations-console
    box1.org/template-version: "1.1.0"
  tags: [java, quarkus, maven, tekton, gitops]
  links:
    - url: https://github.com/box1-org/operations-console
      title: Source Repository
      icon: github
    - url: https://operations-console-dev.apps.ocp.box1.org/q/swagger-ui/
      title: Swagger UI — test endpoints
      icon: code
    - url: https://operations-console-dev.apps.ocp.box1.org/q/openapi
      title: OpenAPI specification
      icon: code
    - url: https://operations-console-dev.apps.ocp.box1.org
      title: Application Route (after first release)
    - url: https://github.com/box1-org/box1-workloads-dev/tree/main/workloads/operations-console
      title: Desired deployment configuration
    - url: https://devspaces.apps.ocp.box1.org/#https://github.com/box1-org/operations-console
      title: Open in Dev Spaces
      icon: code
    # Add actual service-specific observability URLs
    # when dashboards and log views exist.
spec:
  type: service
  lifecycle: experimental
  owner: "user:default/mike"
  system: box1-operations
  providesApis:
    - operations-console-api
  consumesApis:
    - order-service-api
    - inventory-service-api
    - fulfillment-adapter-api
    - asset-service-api
    - scenario-controller-api
    - agentic-operations-api
  dependsOn:
    - component:order-service
    - component:inventory-service
    - component:fulfillment-adapter
    - component:asset-service
    - component:scenario-controller
    - component:agentic-operations
    - resource:keycloak-box1
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: operations-console-api
  description: OpenAPI contract for operations-console
  tags: [quarkus, openapi]
spec:
  type: openapi
  lifecycle: experimental
  owner: "user:default/mike"
  system: box1-operations
  definition:
    $text: https://operations-console-dev.apps.ocp.box1.org/q/openapi
