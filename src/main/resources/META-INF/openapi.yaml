openapi: 3.1.0
info:
  title: operations-console REST API
  version: 1.0.0
  description: |
    Console backend for the box1 Operations console (box1-docs#18). It serves only the console's pages,
    holds the operator's Keycloak session, and owns no business state.

    Authentication is the console's session cookie, set by the Keycloak code flow when a page is opened.
    Requests without a session get 401, and requests without the needed client role get 403.
    State-changing calls must also send `X-Box1-Console: 1` and a JSON body.

    Aggregate responses carry `sources`. A source that is slow, down or refuses the call is reported
    there, and its values are absent, never guessed. Paths match the Experience/BFF prompt (box1-docs#17)
    where that prompt defines them, so the BFF can later serve this contract without page changes.
servers:
  - url: /
tags:
  - name: console
    description: Console backend (session-authenticated)
paths:
  /api/v1/me:
    get:
      tags: [console]
      operationId: getMe
      summary: The signed-in user's name, console roles and environment
      responses:
        "200":
          description: Current session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/overview:
    get:
      tags: [console]
      operationId: getOverview
      summary: Business indicators and the exception queue (console-viewer)
      responses:
        "200":
          description: Overview, possibly partial
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Overview" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/orders:
    get:
      tags: [console]
      operationId: listOrders
      summary: Recent orders with filter, sort and pagination over a bounded window (console-viewer)
      parameters:
        - { name: state, in: query, schema: { $ref: "#/components/schemas/OrderState" } }
        - { name: siteId, in: query, schema: { type: string, pattern: "^site_[A-Za-z0-9_-]{1,64}$" } }
        - { name: sku, in: query, schema: { type: string, minLength: 1, maxLength: 80 } }
        - name: sort
          in: query
          schema: { type: string, enum: [createdAt, -createdAt, updatedAt, -updatedAt], default: -createdAt }
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        "200":
          description: One page of matching orders from the scanned window
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [console]
      operationId: placeOrder
      summary: Place an order through the order service (console-operator)
      parameters:
        - name: X-Box1-Console
          in: header
          required: true
          schema: { type: string, const: "1" }
        - name: Idempotency-Key
          in: header
          required: true
          description: One key per form submission, reused for its retries.
          schema: { type: string, pattern: "^[A-Za-z0-9._:-]{1,255}$" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlaceOrder" }
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlacedOrder" }
        "200":
          description: Same key and payload as an earlier submission; the earlier order is returned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlacedOrder" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "502": { $ref: "#/components/responses/Refused" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v1/orders/{orderId}/summary:
    get:
      tags: [console]
      operationId: getOrderSummary
      summary: Order state, reservation, fulfillment and ERP progress, timeline and evidence (console-viewer)
      parameters:
        - { $ref: "#/components/parameters/OrderId" }
      responses:
        "200":
          description: Summary, possibly partial
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v1/incidents:
    get:
      tags: [console]
      operationId: listIncidents
      summary: Incidents derived from recent order status (console-viewer)
      responses:
        "200":
          description: Derived incidents, possibly partial
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IncidentList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/incidents/{incidentId}/evidence:
    get:
      tags: [console]
      operationId: getIncidentEvidence
      summary: Evidence for one incident (console-viewer)
      parameters:
        - name: incidentId
          in: path
          required: true
          schema: { type: string, pattern: "^inc_[A-Za-z0-9_-]{1,80}$" }
      responses:
        "200":
          description: Evidence, possibly partial
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IncidentEvidence" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v1/sites:
    get:
      tags: [console]
      operationId: listSites
      summary: Stock by site and active asset alerts (console-viewer; alerts need the person's asset-service telemetry-reader role)
      responses:
        "200":
          description: Sites, possibly partial
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/delivery:
    get:
      tags: [console]
      operationId: getDelivery
      summary: Deployed source revision of the console and each upstream (console-developer)
      responses:
        "200":
          description: Revisions, possibly partial
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Delivery" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/scenarios:
    get:
      tags: [console]
      operationId: listScenarios
      summary: Named demo scenarios from the scenario controller (box1-docs#19), with titles and availability (console-viewer)
      responses:
        "200":
          description: Scenario catalog, or why the controller could not be read, in `sources`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScenarioList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/scenarios/{name}/start:
    post:
      tags: [console]
      operationId: startScenario
      summary: Start a named scenario (console-operator; the controller also requires scenario-operator)
      parameters: [{ $ref: "#/components/parameters/ScenarioName" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StartScenario" }
      responses:
        "202":
          description: Run started; follow it with getScenarioRun
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScenarioRun" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ScenarioConflict" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v1/scenarios/{name}/stop:
    post:
      tags: [console]
      operationId: stopScenario
      summary: Stop a scenario's active run; the controller verifies nothing further and resets (console-operator)
      parameters: [{ $ref: "#/components/parameters/ScenarioName" }]
      requestBody: { $ref: "#/components/requestBodies/Empty" }
      responses:
        "200":
          description: The stopped run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScenarioRun" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ScenarioConflict" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v1/scenarios/{name}/reset:
    post:
      tags: [console]
      operationId: resetScenario
      summary: Restore a scenario's fixture stock (additive); stops its active run first (console-operator)
      parameters: [{ $ref: "#/components/parameters/ScenarioName" }]
      requestBody: { $ref: "#/components/requestBodies/Empty" }
      responses:
        "200":
          description: Reset result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResetResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ScenarioConflict" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v1/scenario-runs:
    get:
      tags: [console]
      operationId: listScenarioRuns
      summary: The 20 most recent scenario runs (console-viewer)
      responses:
        "200":
          description: Runs, or why they could not be read, in `sources`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScenarioRunList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/scenario-runs/{scenarioRunId}:
    get:
      tags: [console]
      operationId: getScenarioRun
      summary: One scenario run with its status, operator step, verification and audit (console-viewer)
      parameters: [{ $ref: "#/components/parameters/ScenarioRunId" }]
      responses:
        "200":
          description: The run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScenarioRun" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v1/scenario-runs/{scenarioRunId}/confirm:
    post:
      tags: [console]
      operationId: confirmScenarioStep
      summary: Confirm an operator step the controller cannot observe, e.g. crash-armed, crash-observed (console-operator)
      parameters: [{ $ref: "#/components/parameters/ScenarioRunId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfirmStep" }
      responses:
        "200":
          description: The run after the confirmation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScenarioRun" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ScenarioConflict" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v1/scenario-audit:
    get:
      tags: [console]
      operationId: listScenarioAudit
      summary: The 50 most recent scenario audit records (console-viewer)
      responses:
        "200":
          description: Audit records, or why they could not be read, in `sources`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScenarioAuditList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/scenario-fixtures:
    get:
      tags: [console]
      operationId: getScenarioFixtures
      summary: The Starfleet Feline Supply fixture set the scenarios use (console-viewer)
      responses:
        "200":
          description: Fixture IDs, display names and opening stock
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScenarioFixtures" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/scenario-fixtures/seed:
    post:
      tags: [console]
      operationId: seedScenarioFixtures
      summary: Create the fixture sites and stock once through the inventory service's API; a second call changes nothing (console-operator)
      requestBody: { $ref: "#/components/requestBodies/Empty" }
      responses:
        "200":
          description: How many records were created and how many already matched
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeedResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/ScenarioConflict" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v1/assistant:
    get:
      tags: [console]
      operationId: getAssistantStatus
      summary: Whether the Assistant is connected to agentic-operations and what this person may do there (any console role)
      description: canView and canAnalyze come from the person's own aiops-viewer/aiops-analyst roles; agentic-operations enforces them (box1-docs#101).
      responses:
        "200":
          description: The Assistant's status for this person
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssistantStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/assistant/incidents/{incidentId}/analyses:
    post:
      tags: [console]
      operationId: startIncidentAnalysis
      summary: Ask agentic-operations to analyze an incident; poll the returned analysis (any console role, plus aiops-analyst on agentic-operations)
      description: Starts an evidence-grounded analysis with the person's own token. Suggested actions in the result are proposals only; nothing is executed.
      parameters: [{ $ref: "#/components/parameters/AnalysisIncidentId" }]
      requestBody: { $ref: "#/components/requestBodies/Empty" }
      responses:
        "202":
          description: Queued; poll GET /api/v1/assistant/analyses/{analysisId}
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnalysisSubmitted" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/AssistantBusy" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v1/assistant/analyses/{analysisId}:
    get:
      tags: [console]
      operationId: getIncidentAnalysis
      summary: Read an analysis from agentic-operations (any console role, plus aiops-viewer or aiops-analyst on agentic-operations)
      description: A 404 with code ANALYSIS_EXPIRED means the analysis expired, was evicted, or was lost on restart; it is never regenerated.
      parameters: [{ $ref: "#/components/parameters/AnalysisId" }]
      responses:
        "200":
          description: The analysis; poll while finished is false
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Analysis" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v1/assistant/conversations:
    post:
      tags: [console]
      operationId: startConversation
      summary: Start an Assistant conversation in agentic-operations (any console role, plus aiops-viewer or aiops-analyst there)
      description: The conversation lives in agentic-operations' memory, belongs to you, and is forgotten after 2 hours without activity (box1-docs#101).
      requestBody: { $ref: "#/components/requestBodies/Empty" }
      responses:
        "201":
          description: Started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversationStarted" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v1/assistant/conversations/{conversationId}/messages:
    post:
      tags: [console]
      operationId: sendAssistantMessage
      summary: Ask the Assistant a question; poll the conversation for the answer
      description: The model may read evidence through read-only tools under your own roles; it cannot change anything. A 409 TURN_IN_PROGRESS means the previous message is still being answered.
      parameters: [{ $ref: "#/components/parameters/ConversationId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SendMessage" }
      responses:
        "202":
          description: Queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TurnQueued" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/TurnInProgress" }
        "429": { $ref: "#/components/responses/AssistantBusy" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v1/assistant/conversations/{conversationId}:
    get:
      tags: [console]
      operationId: getConversation
      summary: Read an Assistant conversation; poll while the last turn is not finished
      description: A 404 with code CONVERSATION_EXPIRED means it expired, was evicted, or was lost on restart.
      parameters: [{ $ref: "#/components/parameters/ConversationId" }]
      responses:
        "200":
          description: The conversation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conversation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
components:
  parameters:
    OrderId:
      name: orderId
      in: path
      required: true
      schema: { type: string, pattern: "^ord_[A-Za-z0-9_-]{1,64}$" }
    ScenarioName:
      name: name
      in: path
      required: true
      schema: { type: string, pattern: "^[a-z][a-z0-9-]{1,48}$" }
    ScenarioRunId:
      name: scenarioRunId
      in: path
      required: true
      schema: { type: string, pattern: "^scn_[0-9a-f]{20}$" }
    AnalysisIncidentId:
      name: incidentId
      in: path
      required: true
      description: An order incident, inc_<orderId>
      schema: { type: string, pattern: "^inc_ord_[A-Za-z0-9_-]{1,76}$" }
    AnalysisId:
      name: analysisId
      in: path
      required: true
      schema: { type: string, pattern: "^ana_[0-9a-f]{32}$" }
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema: { type: string, pattern: "^conv_[0-9a-f]{32}$" }
  requestBodies:
    Empty:
      required: true
      description: An empty JSON object; state-changing calls always send a JSON body
      content:
        application/json:
          schema: { type: object, additionalProperties: false }
  responses:
    BadRequest:
      description: Invalid request
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    Unauthorized:
      description: No console session; open the console to sign in
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    Forbidden:
      description: Signed in without the needed console role, or a state-changing call without the console header
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    NotFound:
      description: Not found
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    Conflict:
      description: Same idempotency key with a different payload
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    ScenarioConflict:
      description: The scenario controller refused this now (another run is active, a gate is closed, or the scenario is not yet possible); `detail` says which
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    Refused:
      description: The authoritative source refused the request; retrying will not help
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    Unavailable:
      description: The authoritative source for this resource did not answer (for a create, the outcome is unknown)
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    TurnInProgress:
      description: The previous message in this conversation is still being answered
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    AssistantBusy:
      description: agentic-operations' model queue is full; try again after Retry-After seconds
      headers:
        Retry-After: { schema: { type: integer } }
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details
      required: [type, title, status, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { type: string, description: "Stable machine-readable code, e.g. SESSION_REQUIRED, ROLE_REQUIRED, CONSOLE_HEADER_REQUIRED, UPSTREAM_UNAVAILABLE" }
        source: { $ref: "#/components/schemas/SourceName" }
    SourceName:
      type: string
      enum: [order-service, inventory-service, fulfillment-adapter, asset-service, scenario-controller, agentic-operations]
    SourceStatus:
      type: object
      description: How one upstream answered while building this response (#17 calls this sourceStatus)
      required: [source, status, observedAt]
      properties:
        source: { $ref: "#/components/schemas/SourceName" }
        status:
          type: string
          enum: [OK, DEGRADED, UNAVAILABLE, NOT_AUTHORIZED, NOT_CONFIGURED]
        detail: { type: [string, "null"] }
        latencyMs: { type: [integer, "null"] }
        observedAt: { type: string, format: date-time }
    Sources:
      type: array
      items: { $ref: "#/components/schemas/SourceStatus" }
    ConsoleRole:
      type: string
      enum: [console-viewer, console-operator, console-developer]
    Me:
      type: object
      required: [username, roles, environment, scenarioRoles]
      properties:
        username: { type: string }
        roles: { type: array, items: { $ref: "#/components/schemas/ConsoleRole" } }
        environment: { type: string, description: "Namespace/environment the console serves, e.g. operations-console-dev" }
        scenarioRoles:
          type: array
          description: The person's roles on the scenario controller, which enforces them itself; empty when the console does not forward tokens to it
          items: { type: string, enum: [scenario-viewer, scenario-operator] }
    OrderState:
      type: string
      enum: [SUBMITTED, RESERVED, FULFILLMENT_REQUESTED, SHIPPED, COMPLETED, REJECTED, EXCEPTION, CANCELLED]
    Order:
      type: object
      description: Customer-safe order fields copied from the order service; a field it did not send is null, never guessed
      required: [orderId, state, stateLabel, customerId, sku, quantity, siteId, createdAt, updatedAt]
      properties:
        orderId: { type: string }
        state: { $ref: "#/components/schemas/OrderState" }
        stateLabel: { type: string, description: "Display label; FULFILLMENT_REQUESTED is 'Awaiting ERP acknowledgement'" }
        statusReason: { type: [string, "null"] }
        customerId: { type: [string, "null"], description: Opaque synthetic identifier }
        sku: { type: [string, "null"] }
        quantity: { type: [integer, "null"] }
        siteId: { type: [string, "null"] }
        reservationId: { type: [string, "null"] }
        createdAt: { type: [string, "null"], format: date-time }
        updatedAt: { type: [string, "null"], format: date-time }
        correlationId: { type: [string, "null"] }
        traceId: { type: [string, "null"] }
    OrderPage:
      type: object
      required: [items, page, size, total, window, sources]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Order" } }
        page: { type: integer }
        size: { type: integer }
        total: { type: integer, description: Matching orders within the scanned window }
        window:
          type: object
          required: [scanned, complete]
          properties:
            scanned: { type: integer, description: How many recent orders were read }
            complete: { type: boolean, description: False when older orders exist beyond the window }
        sources: { $ref: "#/components/schemas/Sources" }
    PlaceOrder:
      type: object
      additionalProperties: false
      required: [customerId, sku, quantity, siteId]
      properties:
        customerId: { type: string, pattern: "^cust_[A-Za-z0-9_-]{1,64}$" }
        sku: { type: string, minLength: 1, maxLength: 80 }
        quantity: { type: integer, minimum: 1, maximum: 1000 }
        siteId: { type: string, pattern: "^site_[A-Za-z0-9_-]{1,64}$" }
    PlacedOrder:
      type: object
      required: [order, replayed]
      properties:
        order: { $ref: "#/components/schemas/Order" }
        replayed: { type: boolean, description: True when the order service returned an earlier order for the same key }
    Reservation:
      type: object
      required: [reservationId, status]
      properties:
        reservationId: { type: string }
        status: { type: string, description: "ACTIVE, COMMITTED, CONSUMED, EXPIRED or RELEASED" }
        expiresAt: { type: [string, "null"], format: date-time }
        updatedAt: { type: [string, "null"], format: date-time }
    ErpProgress:
      type: object
      description: ERP progress. Refined from the fulfillment adapter only when it answered; never guessed.
      required: [stage, label, tone, linkMode]
      properties:
        stage:
          type: string
          enum: [NOT_APPLICABLE, UNAVAILABLE, NOT_RECEIVED, QUEUED, UPLOADED_AWAITING_ACK, ACCEPTED, HELD, SHIPPED, REJECTED, NEEDS_ATTENTION]
        label: { type: string }
        tone: { type: string, enum: [neutral, waiting, attention, failure, done, unknown] }
        detail: { type: [string, "null"] }
        linkMode: { type: string, enum: [derived, none], description: How the fulfillment request was found (see D-008) }
        fulfillmentRequestId: { type: [string, "null"] }
        dispatch: { type: [string, "null"] }
        erpAcknowledgement: { type: [string, "null"] }
        outcome: { type: [string, "null"] }
        needsAttentionReason: { type: [string, "null"] }
        revision: { type: [integer, "null"] }
        uploads: { type: [integer, "null"] }
        resends: { type: [integer, "null"] }
        shipmentId: { type: [string, "null"] }
        statusAt: { type: [string, "null"], format: date-time }
    TimelineEntry:
      type: object
      required: [sequence, kind, reasonCode, occurredAt, description]
      properties:
        sequence: { type: integer }
        kind: { type: string, description: "TRANSITION or NOTE, as the order service reports it" }
        description: { type: string, description: Human-readable sentence }
        reasonCode: { type: [string, "null"] }
        fromState: { type: [string, "null"] }
        toState: { type: [string, "null"] }
        occurredAt: { type: string, format: date-time }
        eventId: { type: [string, "null"] }
        eventType: { type: [string, "null"] }
        causationId: { type: [string, "null"] }
        correlationId: { type: [string, "null"] }
        traceId: { type: [string, "null"] }
    EvidenceLink:
      type: object
      required: [kind, label, available]
      properties:
        kind: { type: string, enum: [trace, logs, dashboard, source-revision] }
        label: { type: string }
        available: { type: boolean }
        href: { type: [string, "null"] }
        reason: { type: [string, "null"], description: Why the link is unavailable }
    OrderSummary:
      type: object
      required: [order, erp, timeline, timelineComplete, evidence, sources]
      properties:
        order: { $ref: "#/components/schemas/Order" }
        reservation: { oneOf: [{ $ref: "#/components/schemas/Reservation" }, { type: "null" }] }
        erp: { $ref: "#/components/schemas/ErpProgress" }
        timeline: { type: array, items: { $ref: "#/components/schemas/TimelineEntry" } }
        timelineComplete: { type: boolean }
        evidence: { type: array, items: { $ref: "#/components/schemas/EvidenceLink" } }
        sources: { $ref: "#/components/schemas/Sources" }
    Indicators:
      type: object
      required: [byState, stuck, exceptions, scanned, windowComplete]
      properties:
        byState: { type: object, additionalProperties: { type: integer } }
        stuck: { type: integer, description: "Awaiting ERP acknowledgement longer than the threshold" }
        exceptions: { type: integer }
        scanned: { type: integer }
        windowComplete: { type: boolean }
    Incident:
      type: object
      required: [incidentId, orderId, kind, title, since, active, derived]
      properties:
        incidentId: { type: string }
        orderId: { type: string }
        kind:
          type: string
          description: >-
            Extensible; clients must tolerate new values. Today ORDER_EXCEPTION, AWAITING_ERP_TOO_LONG, or NONE when the
            order service reports no incident condition (the console then claims neither a past incident nor its resolution).
        title: { type: string }
        since: { type: [string, "null"], format: date-time }
        active:
          type: boolean
          description: False only when the order service now reports the order past the incident; the console never infers resolution
        derived: { type: boolean, description: Always true until an incident contract exists (#17) }
    Overview:
      type: object
      required: [indicators, exceptionQueue, stuckThresholdMinutes, sources]
      properties:
        indicators:
          description: Null when the order service did not answer; never reported as zero
          oneOf: [{ $ref: "#/components/schemas/Indicators" }, { type: "null" }]
        exceptionQueue: { type: array, items: { $ref: "#/components/schemas/Incident" } }
        stuckThresholdMinutes: { type: integer }
        sources: { $ref: "#/components/schemas/Sources" }
    IncidentList:
      type: object
      required: [items, window, sources]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Incident" } }
        window:
          type: object
          required: [scanned, complete]
          properties:
            scanned: { type: integer }
            complete: { type: boolean, description: False when older orders were not scanned }
        sources: { $ref: "#/components/schemas/Sources" }
    IncidentEvidence:
      type: object
      required: [incident, summary, sources]
      properties:
        incident: { $ref: "#/components/schemas/Incident" }
        summary: { $ref: "#/components/schemas/OrderSummary" }
        sources: { $ref: "#/components/schemas/Sources" }
    StockLevel:
      type: object
      required: [sku, onHand, reserved, available]
      properties:
        sku: { type: string }
        onHand: { type: [integer, "null"] }
        reserved: { type: [integer, "null"] }
        available: { type: [integer, "null"] }
        updatedAt: { type: [string, "null"], format: date-time }
    Site:
      type: object
      required: [siteId, stock]
      properties:
        siteId: { type: string }
        stock: { type: array, items: { $ref: "#/components/schemas/StockLevel" } }
    Alert:
      type: object
      required: [alertId, siteId, assetId, metricName, severity]
      properties:
        alertId: { type: string }
        siteId: { type: string }
        assetId: { type: string }
        metricName: { type: string }
        unit: { type: [string, "null"] }
        severity: { type: string }
        threshold: { type: [number, "null"] }
        peakValue: { type: [number, "null"] }
        lastValue: { type: [number, "null"] }
        activatedAt: { type: [string, "null"], format: date-time }
        escalatedAt: { type: [string, "null"], format: date-time }
    SiteList:
      type: object
      required: [items, alerts, telemetryConsoleUrl, sources]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Site" } }
        alerts:
          type: array
          description: Active asset-service alerts, newest first; empty when asset-service did not answer (see sources)
          items: { $ref: "#/components/schemas/Alert" }
        telemetryConsoleUrl: { type: string }
        sources: { $ref: "#/components/schemas/Sources" }
    ServiceRevision:
      type: object
      required: [service]
      properties:
        service: { type: string }
        gitRef: { type: [string, "null"] }
        version: { type: [string, "null"] }
        commitUrl: { type: [string, "null"] }
    Delivery:
      type: object
      required: [services, sources]
      properties:
        services: { type: array, items: { $ref: "#/components/schemas/ServiceRevision" } }
        sources: { $ref: "#/components/schemas/Sources" }
    Scenario:
      type: object
      required: [name, operatorSteps]
      properties:
        name: { type: string, description: "Plain ID, e.g. inventory-contention" }
        title: { type: [string, "null"], description: "Display title, e.g. The Trouble with Tribbles" }
        description: { type: [string, "null"] }
        mechanism: { type: [string, "null"], description: "SERVICE_API, GUIDED_ERP, VM_LEVEL or PLATFORM" }
        availability: { type: [string, "null"], description: "AVAILABLE or NOT_YET_POSSIBLE" }
        notPossibleReason: { type: [string, "null"] }
        defaultDurationSeconds: { type: [integer, "null"] }
        maxDurationSeconds: { type: [integer, "null"] }
        expectedObservation: { type: [string, "null"] }
        resetAction: { type: [string, "null"] }
        operatorSteps: { type: array, items: { type: string } }
    ScenarioList:
      type: object
      required: [items, telemetryConsoleUrl, sources]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Scenario" } }
        telemetryConsoleUrl: { type: string }
        sources: { $ref: "#/components/schemas/Sources" }
    StartScenario:
      type: object
      properties:
        ttlSeconds: { type: [integer, "null"], minimum: 30, maximum: 3600, description: "Omit for the scenario's default" }
    ConfirmStep:
      type: object
      required: [step]
      properties:
        step: { type: string, pattern: "^[a-z][a-z0-9-]{1,40}$", description: "e.g. crash-armed, crash-observed" }
    ScenarioAudit:
      type: object
      properties:
        seq: { type: [integer, "null"] }
        scenarioRunId: { type: [string, "null"] }
        scenario: { type: [string, "null"] }
        action: { type: [string, "null"] }
        outcome: { type: [string, "null"] }
        actor: { type: [string, "null"] }
        environment: { type: [string, "null"] }
        detail: { type: [string, "null"] }
        occurredAt: { type: [string, "null"], format: date-time }
        stardate: { type: [string, "null"], description: "Display only; occurredAt is authoritative" }
    ScenarioRun:
      type: object
      required: [scenarioRunId]
      properties:
        scenarioRunId: { type: string }
        scenario: { type: [string, "null"] }
        title: { type: [string, "null"] }
        mode: { type: [string, "null"] }
        status: { type: [string, "null"], description: "e.g. RUNNING, AWAITING_OPERATOR, VERIFIED, NOT_VERIFIED, FAILED, STOPPED, EXPIRED" }
        detail: { type: [string, "null"] }
        operatorStep: { type: [string, "null"], description: "What the operator must do now, e.g. at the ERP console" }
        operatorStepId: { type: [string, "null"], description: "A step to confirm with confirmScenarioStep, when the controller cannot observe it" }
        actor: { type: [string, "null"] }
        environment: { type: [string, "null"] }
        ttlSeconds: { type: [integer, "null"] }
        correlationId: { type: [string, "null"] }
        startedAt: { type: [string, "null"], format: date-time }
        startedStardate: { type: [string, "null"] }
        expiresAt: { type: [string, "null"], format: date-time }
        endedAt: { type: [string, "null"], format: date-time }
        resetResult: { type: [string, "null"] }
        resetDetail: { type: [string, "null"] }
        resetAt: { type: [string, "null"], format: date-time }
        audit:
          type: [array, "null"]
          items: { $ref: "#/components/schemas/ScenarioAudit" }
    ScenarioRunList:
      type: object
      required: [items, sources]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ScenarioRun" } }
        sources: { $ref: "#/components/schemas/Sources" }
    ScenarioAuditList:
      type: object
      required: [items, sources]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ScenarioAudit" } }
        sources: { $ref: "#/components/schemas/Sources" }
    ScenarioFixtures:
      type: object
      required: [sites, customers, products, stock, sources]
      properties:
        sites:
          type: array
          items:
            type: object
            required: [siteId]
            properties: { siteId: { type: string }, displayName: { type: [string, "null"] }, status: { type: [string, "null"] } }
        customers:
          type: array
          items:
            type: object
            required: [customerId]
            properties: { customerId: { type: string }, displayName: { type: [string, "null"] } }
        products:
          type: array
          items:
            type: object
            required: [sku]
            properties: { sku: { type: string }, displayName: { type: [string, "null"] } }
        stock:
          type: array
          items:
            type: object
            required: [siteId, sku]
            properties: { siteId: { type: string }, sku: { type: string }, openingQuantity: { type: [integer, "null"] } }
        sources: { $ref: "#/components/schemas/Sources" }
    SeedResult:
      type: object
      required: [created, unchanged]
      properties:
        created: { type: integer }
        unchanged: { type: integer }
    ResetResult:
      type: object
      properties:
        scenarioRunId: { type: [string, "null"] }
        resetId: { type: [string, "null"] }
        resetResult: { type: [string, "null"] }
        resetDetail: { type: [string, "null"] }
    AssistantStatus:
      type: object
      required: [configured, canView, canAnalyze, roles]
      properties:
        configured: { type: boolean, description: "The console is connected to agentic-operations" }
        canView: { type: boolean, description: "The person holds aiops-viewer or aiops-analyst" }
        canAnalyze: { type: boolean, description: "The person holds aiops-analyst" }
        roles: { type: array, items: { type: string, enum: [aiops-viewer, aiops-analyst] } }
    AnalysisSubmitted:
      type: object
      required: [analysisId, incidentId]
      properties:
        analysisId: { type: string }
        incidentId: { type: string }
        status: { type: [string, "null"] }
    AnalysisStatus:
      type: string
      description: QUEUED and RUNNING are in progress; every other status is final. Only COMPLETED and DEGRADED carry a diagnosis.
      enum: [QUEUED, RUNNING, COMPLETED, DEGRADED, MODEL_UNAVAILABLE, MODEL_INVALID_OUTPUT, FAILED]
    AnalysisFinding:
      type: object
      required: [statement, evidenceRefs]
      properties:
        statement: { type: string }
        evidenceRefs: { type: array, items: { type: string } }
        confidence: { type: [string, "null"], description: "LOW, MEDIUM or HIGH" }
    AnalysisSuggestedAction:
      type: object
      required: [type, executed]
      description: A proposal only. Neither agentic-operations nor the console executes it.
      properties:
        type: { type: string }
        description: { type: [string, "null"] }
        expectedEffect: { type: [string, "null"] }
        rollback: { type: [string, "null"] }
        executed: { type: boolean, const: false }
    AnalysisEvidence:
      type: object
      required: [ref, truncated]
      properties:
        ref: { type: string }
        type: { type: [string, "null"] }
        source: { type: [string, "null"] }
        timestamp: { type: [string, "null"], format: date-time }
        retrievedAt: { type: [string, "null"], format: date-time }
        retrievalStatus: { type: [string, "null"], description: "OK, UNAVAILABLE, NOT_FOUND, UNAUTHORIZED, ERROR, TIMEOUT, UNREACHABLE or CONFLICTING" }
        detail: { type: [string, "null"] }
        link: { type: [string, "null"], description: "A trusted identifier built by agentic-operations, e.g. source plus ID" }
        truncated: { type: boolean }
    Analysis:
      type: object
      required: [analysisId, status, finished, findings, unknowns, suggestedActions, evidence]
      properties:
        analysisId: { type: string }
        incidentId: { type: [string, "null"] }
        orderId: { type: [string, "null"] }
        incidentType: { type: [string, "null"] }
        status: { $ref: "#/components/schemas/AnalysisStatus" }
        finished: { type: boolean }
        statusDetail: { type: [string, "null"] }
        createdAt: { type: [string, "null"], format: date-time }
        completedAt: { type: [string, "null"], format: date-time }
        summary: { type: [string, "null"] }
        findings: { type: array, items: { $ref: "#/components/schemas/AnalysisFinding" } }
        unknowns: { type: array, items: { type: string } }
        suggestedActions: { type: array, items: { $ref: "#/components/schemas/AnalysisSuggestedAction" } }
        evidence: { type: array, items: { $ref: "#/components/schemas/AnalysisEvidence" } }
        model:
          type: [object, "null"]
          properties:
            modelId: { type: [string, "null"] }
            contextProfile: { type: [string, "null"] }
            promptTokens: { type: [integer, "null"] }
            completionTokens: { type: [integer, "null"] }
        quality:
          type: [object, "null"]
          properties:
            citedFindings: { type: integer }
            unsupportedAssertions: { type: integer }
            droppedActions: { type: integer }
    ConversationStarted:
      type: object
      required: [conversationId]
      properties:
        conversationId: { type: string }
    SendMessage:
      type: object
      required: [text]
      additionalProperties: false
      properties:
        text: { type: string, minLength: 1, maxLength: 2000 }
    TurnQueued:
      type: object
      required: [conversationId]
      properties:
        conversationId: { type: string }
        turnId: { type: [string, "null"] }
        status: { type: [string, "null"] }
    ChatStep:
      type: object
      required: [durationMs]
      description: One read-only tool call the model made. target is an ID agentic-operations validated, or "-"/"invalid".
      properties:
        tool: { type: [string, "null"] }
        target: { type: [string, "null"] }
        decision: { type: [string, "null"], description: "ok, invalid_argument, not_found, unknown_tool, limit or error" }
        retrievalStatus: { type: [string, "null"] }
        durationMs: { type: integer }
    ChatTurn:
      type: object
      required: [finished, steps]
      properties:
        turnId: { type: [string, "null"] }
        question: { type: [string, "null"] }
        status:
          type: [string, "null"]
          description: QUEUED and RUNNING are in progress. COMPLETED and LIMIT_REACHED carry an answer; MODEL_UNAVAILABLE, MODEL_INVALID_OUTPUT and FAILED do not.
        finished: { type: boolean }
        statusDetail: { type: [string, "null"] }
        answer: { type: [string, "null"], description: "Model text. Render as plain text; it can be wrong." }
        steps: { type: array, items: { $ref: "#/components/schemas/ChatStep" } }
        model:
          type: [object, "null"]
          properties:
            modelId: { type: [string, "null"] }
            modelCalls: { type: integer }
            toolCalls: { type: integer }
            promptTokens: { type: [integer, "null"] }
            completionTokens: { type: [integer, "null"] }
        startedAt: { type: [string, "null"], format: date-time }
        completedAt: { type: [string, "null"], format: date-time }
    Conversation:
      type: object
      required: [conversationId, turns]
      properties:
        conversationId: { type: string }
        createdAt: { type: [string, "null"], format: date-time }
        updatedAt: { type: [string, "null"], format: date-time }
        turns: { type: array, items: { $ref: "#/components/schemas/ChatTurn" } }
