quarkus.application.name=operations-console
quarkus.http.host=0.0.0.0
greeting.prefix=${GREETING_PREFIX:Hello}
quarkus.smallrye-openapi.info-title=operations-console REST API
quarkus.smallrye-openapi.info-version=1.0.0
# Jib pushes directly to the registry. Build/push are opt-in at build time.
quarkus.container-image.builder=jib
quarkus.jib.base-jvm-image=registry.access.redhat.com/ubi9/openjdk-21-runtime@sha256:cfa544effa28c5c57197a4c9d460812e70efc0965e6f518e1c2e787ff3cb9335
quarkus.jib.platforms=linux/amd64
quarkus.jib.use-current-timestamp=false

# The catalog reads the deployed contract; Swagger uses the public HTTPS Route.
%prod.quarkus.smallrye-openapi.servers=${PUBLIC_API_URL:https://operations-console-dev.apps.ocp.box1.org}
quarkus.swagger-ui.always-include=true
# Allow Developer Hub's API Definition tester to call the public template endpoints. Credentials are never allowed
# cross-origin, and X-Box1-Console is deliberately not an allowed header (CSRF defence, decision D-003).
# The console's own https origin is listed because the edge Route terminates TLS: the pod sees http, so without it
# the console's own POSTs are rejected as cross-origin (asset-service run 15, repair 19).
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=https://developer-hub.apps.ocp.box1.org,${console.public-origin}
quarkus.http.cors.methods=GET,HEAD,OPTIONS,POST,PUT,PATCH,DELETE
quarkus.http.cors.headers=Accept,Authorization,Content-Type
quarkus.http.cors.access-control-allow-credentials=false

# ---------------------------------------------------------------------------------------------------------------
# Console: Keycloak code flow; the backend holds the session (decisions D-002, D-003)
# ---------------------------------------------------------------------------------------------------------------
quarkus.oidc.auth-server-url=${CONSOLE_OIDC_URL:https://keycloak.apps.ocp.box1.org/auth/realms/box1}
quarkus.oidc.client-id=${CONSOLE_OIDC_CLIENT_ID:operations-console}
quarkus.oidc.application-type=web-app
quarkus.oidc.authentication.pkce-required=true
quarkus.oidc.authentication.redirect-path=/callback
quarkus.oidc.authentication.restore-path-after-redirect=true
quarkus.oidc.authentication.cookie-path=/
quarkus.oidc.authentication.cookie-same-site=strict
# The edge Route terminates TLS: build https redirect URIs and mark cookies Secure (asset-service SEC-1).
quarkus.oidc.authentication.force-redirect-https-scheme=true
quarkus.oidc.authentication.cookie-force-secure=true
quarkus.oidc.authentication.java-script-auto-redirect=false
quarkus.oidc.token.principal-claim=preferred_username
quarkus.oidc.token.refresh-expired=true
quarkus.oidc.roles.role-claim-path=resource_access/operations-console/roles
quarkus.oidc.roles.source=accesstoken
quarkus.oidc.token-state-manager.split-tokens=true
quarkus.oidc.logout.path=/logout
quarkus.oidc.logout.post-logout-path=/signed-out.html
# The client is public, so no session key can be derived from a client secret. Without CONSOLE_SESSION_KEY the key
# is generated per process: restarts sign users out and only one replica works (decision D-003, user decision O-3).
quarkus.oidc.token-state-manager.encryption-secret=${CONSOLE_SESSION_KEY:}

quarkus.http.auth.proactive=false
# Only what the release smoke task and Developer Hub need is public (review SEC-5); Swagger UI needs a session.
quarkus.http.auth.permission.public.paths=/api/greetings,/api/info,/q/health,/q/health/*,/q/openapi,/q/metrics,/signed-out.html,/signed-out.css,/brand/*
quarkus.http.auth.permission.public.policy=permit
quarkus.http.auth.permission.console.paths=/*
quarkus.http.auth.permission.console.policy=authenticated

# Security and cache headers (decision D-003). Hashed assets are immutable; everything else is never cached.
# style-src allows exactly one inline stylesheet by hash: react-aria-components 1.22.1's 'react-aria-pressable-style'
# (touch-action rule). Pinned dependency; the Firefox e2e fails on any CSP violation, so a changed hash is caught.
quarkus.http.header."Content-Security-Policy".value=default-src 'self'; img-src 'self' data:; style-src 'self' 'sha256-38RhXrc7EdReTKsOm23ZPOCUgniTUUcjky8QOOrQx6o='; script-src 'self'; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'
quarkus.http.header."X-Frame-Options".value=DENY
quarkus.http.header."X-Content-Type-Options".value=nosniff
quarkus.http.header."Referrer-Policy".value=no-referrer
quarkus.http.header."Strict-Transport-Security".value=max-age=31536000
# Cache-Control is set per path by org.box1.console.web.SpaFallback.

# ---------------------------------------------------------------------------------------------------------------
# Upstreams: in-cluster Services, short timeouts, bounded concurrency (decisions D-004, D-007, D-008)
# ---------------------------------------------------------------------------------------------------------------
console.upstream.order-service-url=${ORDER_SERVICE_URL:}
console.upstream.inventory-service-url=${INVENTORY_SERVICE_URL:}
console.upstream.fulfillment-adapter-url=${FULFILLMENT_ADAPTER_URL:}
console.upstream.asset-service-url=${ASSET_SERVICE_URL:}
console.upstream.scenario-controller-url=${SCENARIO_CONTROLLER_URL:}
console.upstream.agentic-operations-url=${AGENTIC_OPERATIONS_URL:}
console.fulfillment-link=${CONSOLE_FULFILLMENT_LINK:none}
console.stuck-threshold=${CONSOLE_STUCK_THRESHOLD:10m}
console.environment=${CONSOLE_ENVIRONMENT:operations-console-dev}
console.public-origin=${CONSOLE_PUBLIC_ORIGIN:https://operations-console-dev.apps.ocp.box1.org}
# Trace viewer (box1-docs#22): the OpenShift console's Observe > Traces page on the box1 TempoStack (dev tenant).
# Viewing it needs OpenShift access. Empty removes the link. Override with CONSOLE_TRACE_URL_TEMPLATE; the value is
# set directly, not as ${CONSOLE_TRACE_URL_TEMPLATE:...}, because the "}" of {traceId} would end that expression.
console.trace-url-template=https://console-openshift-console.apps.ocp.box1.org/observe/traces/{traceId}?namespace=box1-observability&name=box1&tenant=dev
# Log viewer (box1-docs#22): the OpenShift console's Observe > Logs page (LokiStack), application logs from every service
# whose JSON MDC carries the trace ID, one line per entry as "<pod> <level> <message>". Empty removes the link. Override
# with CONSOLE_LOGS_URL_TEMPLATE; set directly for the same reason as the trace template.
console.logs-url-template=https://console-openshift-console.apps.ocp.box1.org/monitoring/logs?q=%7B+log_type%3D%22application%22+%7D+%7C+json+%7C+structured_mdc_traceId%3D%22{traceId}%22+%7C+line_format+%22%7B%7Bprintf+%5C%22%25-45s%5C%22+.kubernetes_pod_name%7D%7D+%7B%7B.structured_level%7D%7D+%7B%7B.structured_message%7D%7D%22&showResources=0&showStats=0
# Order flow dashboard (box1-docs#22): Observe > Dashboards, box1-order-flow in box1-observability. Not order-specific.
# Empty removes the link.
console.dashboard-url=${CONSOLE_DASHBOARD_URL:https://console-openshift-console.apps.ocp.box1.org/monitoring/v2/dashboards/view?dashboard=box1-order-flow&project=box1-observability&refresh=30s}
console.telemetry-console-url=${TELEMETRY_CONSOLE_URL:https://asset-service-dev.apps.ocp.box1.org/console/}
# Forward the user's token to upstreams only with a client whose tokens are meant for them (review SEC-1/SEC-3, O-9).
console.forward-user-token=${CONSOLE_FORWARD_USER_TOKEN:false}
# The scenario controller is the one upstream whose audience the console's token carries (box1-docs#19): its own
# scenario-viewer/-operator roles decide what each person may do, and its audit names the person.
console.upstream.scenario-controller-forward-token=${CONSOLE_SCENARIO_FORWARD_TOKEN:false}
# asset-service reads (box1-docs#80, interim until box1-docs#79): the console's token carries audience asset-service
# and only the telemetry-reader role, and asset-service keeps only that role for the console's tokens.
console.upstream.asset-service-forward-token=${CONSOLE_ASSET_FORWARD_TOKEN:false}
# The Assistant (box1-docs#101): the console's token carries audience agentic-operations and only the aiops-viewer and
# aiops-analyst roles; agentic-operations accepts azp operations-console, enforces the person's own roles and audits
# them. The Assistant reports itself not configured unless both the URL and this flag are set.
console.upstream.agentic-operations-forward-token=${CONSOLE_AIOPS_FORWARD_TOKEN:false}
# Bounded metric tags for client-side routes (review OPS-3).
quarkus.micrometer.binder.http-server.match-patterns=/orders/[^/]+=/orders/{id},/incidents/[^/]+=/incidents/{id},/api/v1/scenarios/[^/]+/[a-z]+=/api/v1/scenarios/{name}/{action},/api/v1/scenario-runs/[^/]+/confirm=/api/v1/scenario-runs/{id}/confirm,/api/v1/scenario-runs/[^/]+=/api/v1/scenario-runs/{id},/api/v1/assistant/analyses/[^/]+=/api/v1/assistant/analyses/{id},/api/v1/assistant/incidents/[^/]+/analyses=/api/v1/assistant/incidents/{id}/analyses

# Observability: JSON logs with trace context (box1-docs#22).
quarkus.log.console.json.additional-field."service".value=operations-console
%dev.quarkus.log.console.json.enabled=false
%test.quarkus.log.console.json.enabled=false
# Trace export (box1-docs#22). The exporter and sampler are fixed at build
# time, so the OTLP exporter is built in and export is switched at run time:
# sampling ratio 0.0 exports nothing. The deployment turns it on with
# QUARKUS_OTEL_TRACES_SAMPLER_ARG=1.0 and QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT.
# Unsampled spans still carry valid trace IDs, so traceparent propagation and
# correlation are unchanged. Dev and test keep the previous behaviour.
quarkus.otel.traces.exporter=cdi
quarkus.otel.traces.sampler=traceidratio
quarkus.otel.traces.sampler.arg=0.0
%dev.quarkus.otel.traces.exporter=none
%dev.quarkus.otel.traces.sampler=parentbased_always_on
%test.quarkus.otel.traces.exporter=none
%test.quarkus.otel.traces.sampler=parentbased_always_on
quarkus.otel.metrics.exporter=none
quarkus.otel.logs.exporter=none
quarkus.otel.propagators=tracecontext

# ---------------------------------------------------------------------------------------------------------------
# Tests: WireMock OIDC server; plain http
# ---------------------------------------------------------------------------------------------------------------
%test.quarkus.oidc.auth-server-url=${keycloak.url}/realms/quarkus/
%test.quarkus.oidc.client-id=quarkus-web-app
%test.quarkus.oidc.authentication.force-redirect-https-scheme=false
%test.quarkus.oidc.authentication.cookie-force-secure=false
%test.console.public-origin=https://operations-console-dev.apps.ocp.box1.org
quarkus.test.integration-test-profile=test

# No Dev Services: CI has no container runtime; tests use the WireMock OIDC server and stubbed upstreams.
quarkus.devservices.enabled=false
